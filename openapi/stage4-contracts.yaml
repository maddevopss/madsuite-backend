openapi: 3.0.3
info:
  title: MADSuite — Contrats institutionnels de l’étage 4
  version: "1.0.0"
  description: |
    Contrats versionnés pour les listes, ressources, capacités, transitions et erreurs.

    ## Versioning & Deprecation

    Tous les contrats sont versionnés avec le format `{name}@{major}.{minor}` dans le champ `meta.contract`.

    ### Contrats Actuels
    - `integration-list@1` — Format de réponse pour les listes paginées
    - `integration-resource@1` — Format de réponse pour une ressource unique
    - `server-capabilities@1` — Format des capacités calculées côté serveur
    - `transition@1` — Format des demandes et réponses de transition
    - `block-closure@1` — Format des erreurs de fermeture de bloc

    ### Dépréciations et Migration

    Lorsqu’une version de contrat est dépréciée, le serveur retourne :
    - Header `Deprecation: true`
    - Header `Sunset: <RFC-2822-date>` — date de suppression planifiée
    - Header `X-Contract-Deprecated: <contract@version>` — identifiant du contrat
    - Champ `meta.deprecated: true` dans la réponse
    - Champ `meta.replacedBy: <new-contract@version>` si applicable

    Les clients doivent surveiller ces indicateurs et migrer vers la nouvelle version avant la date Sunset.
components:
  parameters:
    PageLimit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PageCursor:
      in: query
      name: cursor
      schema: { type: string, maxLength: 500 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  schemas:
    ContractMeta:
      type: object
      required: [contract]
      properties:
        contract: { type: string, example: integration-list@1 }
        deprecated: { type: boolean, default: false }
        sunset: { type: string, format: date-time, nullable: true }
        replacedBy: { type: string, nullable: true }
    PageMeta:
      allOf:
        - $ref: '#/components/schemas/ContractMeta'
        - type: object
          required: [limit, hasMore]
          properties:
            limit: { type: integer }
            hasMore: { type: boolean }
            nextCursor: { type: string, nullable: true }
    CapabilityReason:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: permission.insufficient }
        message: { type: string }
    Capability:
      type: object
      required: [allowed, reason]
      properties:
        allowed: { type: boolean }
        reason:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/CapabilityReason' }]
    Capabilities:
      type: object
      required: [read, create, update, approve, close]
      additionalProperties: { $ref: '#/components/schemas/Capability' }
    Evidence:
      type: object
      required: [type, id]
      properties:
        type: { type: string, maxLength: 100 }
        id: { type: string, maxLength: 200 }
      additionalProperties: true
    TransitionRequest:
      type: object
      required: [rationale, evidence]
      properties:
        rationale: { type: string, minLength: 3, maxLength: 2000 }
        evidence:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/Evidence' }
    BusinessError:
      type: object
      required: [code, message, details]
      properties:
        code: { type: string, example: transition.evidence_required }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/BusinessError' }
  responses:
    InvalidTransition:
      description: Entrée de transition invalide.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: transition.evidence_required
              message: transition.evidence_required
              details: { field: evidence }
    DeprecatedContractWarning:
      description: |
        Contrat déprécié — client doit migrer vers la nouvelle version.
        Retourne les headers HTTP de dépréciation.
      headers:
        Deprecation:
          schema: { type: string, enum: ['true'] }
          description: Indique que le contrat est déprécié
        Sunset:
          schema: { type: string, format: date-time }
          description: Date RFC-2822 de suppression planifiée
        X-Contract-Deprecated:
          schema: { type: string, example: 'integration-list@1' }
          description: Identifiant du contrat déprécié
        Link:
          schema: { type: string, example: '<integration-list@2>; rel="successor-version"' }
          description: Lien vers la version successive
  examples:
    ListResponseV1:
      summary: Réponse de liste avec versioning (v1)
      value:
        items:
          - id: 123
            name: "Exemple"
            createdAt: "2026-08-03T00:00:00Z"
        meta:
          contract: "integration-list@1"
          count: 1
          limit: 25
          hasMore: false
          deprecated: false
          nextCursor: null
    ListResponseV1Deprecated:
      summary: Réponse de liste dépréciée avec metadata
      value:
        items:
          - id: 123
            name: "Exemple"
        meta:
          contract: "integration-list@1"
          count: 1
          limit: 25
          hasMore: false
          deprecated: true
          sunset: "2026-12-31T23:59:59Z"
          replacedBy: "integration-list@2"
paths: {}
